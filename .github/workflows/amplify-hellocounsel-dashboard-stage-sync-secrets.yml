name: Sync secrets to AWS - amplify-hellocounsel-dashboard - stage

# Pushes this repo's GitHub Environment secrets/variables into the Amplify app's
# environment variables (app-level and per-branch). Terraform (infrastructure-v1)
# owns the app/branches and platform vars (ignore_changes on env vars); this
# workflow owns the values.
#
# Key list is DERIVED from the live app/branches (no mapping file):
#   - App-level keys come from get-app; GitHub name == key.
#   - Branch-level keys come from get-branch; GitHub name == <BRANCH_UPPER>_<key>
#     (the branch prefix disambiguates them inside the one environment).
# A key with no matching GitHub value keeps its current value, so Terraform-owned
# platform vars (e.g. AMPLIFY_*) are preserved automatically.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  APP_ID: d2ae5t3hau5787

jobs:
  sync:
    runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    environment: amplify-hellocounsel-dashboard-stage
    steps:
      - name: Assume the target account deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Push env vars to the Amplify app and branches
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail

          # Merge vars + secrets into one lookup map (Amplify stores both as env vars).
          ALL=$(jq -s 'add' <(echo "$VARS_JSON") <(echo "$SECRETS_JSON"))

          # ---- App-level: keep current keys, overlay same-named GitHub values.
          cur_app=$(aws amplify get-app --app-id "$APP_ID" \
            --query 'app.environmentVariables' --output json)
          app_map=$(jq -n --argjson cur "$cur_app" --argjson all "$ALL" '
            $cur | with_entries(
              .key as $k
              | .value = ( ($all[$k]) as $v | if $v == null or $v == "" then .value else $v end )
            )')
          if [ "$(jq 'length' <<<"$app_map")" -gt 0 ]; then
            aws amplify update-app --app-id "$APP_ID" --environment-variables "$app_map" >/dev/null
            echo "Updated app-level env vars on $APP_ID"
          fi

          # ---- Branch-level: enumerate branches; GitHub name == <BRANCH_UPPER>_<key>.
          aws amplify list-branches --app-id "$APP_ID" \
            --query 'branches[].branchName' --output text | tr '\t' '\n' | while read -r branch; do
            [ -n "$branch" ] || continue
            pfx="$(echo "$branch" | tr '[:lower:]' '[:upper:]' | tr '-' '_')_"
            cur_br=$(aws amplify get-branch --app-id "$APP_ID" --branch-name "$branch" \
              --query 'branch.environmentVariables' --output json)
            br_map=$(jq -n --argjson cur "$cur_br" --argjson all "$ALL" --arg p "$pfx" '
              $cur | with_entries(
                .key as $k
                | .value = ( ($all[$p + $k]) as $v | if $v == null or $v == "" then .value else $v end )
              )')
            if [ "$(jq 'length' <<<"$br_map")" -gt 0 ]; then
              aws amplify update-branch --app-id "$APP_ID" --branch-name "$branch" \
                --environment-variables "$br_map" >/dev/null
              echo "Updated branch env vars on $branch"
            fi
            job_id=$(aws amplify start-job --app-id "$APP_ID" --branch-name "$branch" \
              --job-type RELEASE --query 'jobSummary.jobId' --output text)
            echo "Started release job $job_id on $branch"
          done
