name: Sync secrets to AWS - post-call-service - stage

# Pushes this repo's GitHub Environment secrets/variables into the AWS resources
# Terraform (infrastructure-v1) created for this ECS service. Terraform owns the
# containers (Secrets Manager secret + SSM parameters, seeded with placeholders
# and ignore_changes); this workflow owns the values.
#
# Key list is DERIVED from the live AWS resources (no mapping file): the secret
# doc's existing keys and the SSM params under the service prefix are the
# allowlist. For each key, the same-named GitHub secret/variable supplies the
# value. A key with no matching GitHub value keeps its current value.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ORG: hc
  ENVIRONMENT: stage
  INDEX: "01"
  SERVICE: post-call-service

jobs:
  sync:
    runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    environment: post-call-service-stage
    steps:
      - name: Assume the target account deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Push values to Secrets Manager and Parameter Store
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail

          secret_name="$ORG/$ENVIRONMENT/$INDEX/$SERVICE/secret"
          ssm_prefix="/$ORG/$ENVIRONMENT/$INDEX/$SERVICE"

          # ---- Secrets Manager: derive keys from the existing doc, overlay
          # same-named GitHub secrets. Missing/empty -> keep current value.
          cur=$(aws secretsmanager get-secret-value --secret-id "$secret_name" \
            --query SecretString --output text)
          payload=$(jq -n --argjson cur "$cur" --argjson gh "$SECRETS_JSON" '
            $cur | with_entries(
              .key as $k
              | .value = ( ($gh[$k]) as $v | if $v == null or $v == "" then .value else $v end )
            )')
          if [ "$(jq 'length' <<<"$payload")" -gt 0 ]; then
            aws secretsmanager put-secret-value --secret-id "$secret_name" \
              --secret-string "$payload" >/dev/null
            echo "Updated Secrets Manager secret: $secret_name"
          fi

          # ---- SSM Parameter Store: one param per existing key under the prefix.
          # Update-only (Terraform owns creation). Missing/empty GitHub var -> skip.
          aws ssm get-parameters-by-path --path "$ssm_prefix" --recursive \
            --query 'Parameters[].Name' --output text | tr '\t' '\n' | while read -r name; do
            [ -n "$name" ] || continue
            key="${name##*/}"
            val=$(jq -r --arg k "$key" '.[$k] // empty' <<<"$VARS_JSON")
            [ -n "$val" ] || { echo "skip $name (no GitHub variable $key)"; continue; }
            aws ssm put-parameter --name "$name" --type String --value "$val" --overwrite >/dev/null
            echo "Updated SSM parameter: $name"
          done

      - name: Roll the ECS service so new values take effect
        run: |
          set -euo pipefail

          cluster="$ORG-$ENVIRONMENT-$INDEX-main-cluster"
          service="$ORG-$ENVIRONMENT-$INDEX-$SERVICE-svc"

          controller=$(aws ecs describe-services --cluster "$cluster" --services "$service" \
            --query 'services[0].deploymentController.type' --output text)

          if [ "$controller" = "CODE_DEPLOY" ]; then
            cd_app="$service-app"
            cd_group="$service-grp"
            taskdef=$(aws ecs describe-services --cluster "$cluster" --services "$service" \
              --query 'services[0].taskDefinition' --output text)
            container=$(aws ecs describe-task-definition --task-definition "$taskdef" \
              --query 'taskDefinition.containerDefinitions[0].name' --output text)
            port=$(aws ecs describe-task-definition --task-definition "$taskdef" \
              --query 'taskDefinition.containerDefinitions[0].portMappings[0].containerPort' --output text)

            appspec=$(jq -nc --arg td "$taskdef" --arg cn "$container" --argjson cp "$port" \
              '{version:"0.0",Resources:[{TargetService:{Type:"AWS::ECS::Service",Properties:{TaskDefinition:$td,LoadBalancerInfo:{ContainerName:$cn,ContainerPort:$cp}}}}]}')
            revision=$(jq -nc --arg content "$appspec" '{revisionType:"AppSpecContent",appSpecContent:{content:$content}}')

            dep_id=$(aws deploy create-deployment --application-name "$cd_app" \
              --deployment-group-name "$cd_group" --revision "$revision" \
              --query 'deploymentId' --output text)
            echo "Started CodeDeploy deployment $dep_id for $service"
          else
            aws ecs update-service --cluster "$cluster" --service "$service" \
              --force-new-deployment >/dev/null
            echo "Triggered ECS redeploy of $service"
          fi
