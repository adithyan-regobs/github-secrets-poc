name: Sync secrets to AWS - gha-test - stage

# Test harness for the sync-secrets approach. Pushes this repo's GitHub
# Environment secrets/variables into the throwaway AWS resources created by
# terraform-test/ (Secrets Manager secret + SSM params, seeded with placeholders
# and ignore_changes). Same overlay logic as the real service workflows; the
# final step reads the values back instead of rolling an ECS service.
#
# Key list is DERIVED from the live AWS resources: the secret doc's existing
# keys and the SSM params under the service prefix. For each key, the same-named
# GitHub secret/variable supplies the value. A key with no matching GitHub value
# keeps its current value.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ORG: hc
  ENVIRONMENT: stage
  INDEX: "01"
  SERVICE: gha-test

jobs:
  sync:
    runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    environment: gha-test-stage
    steps:
      - name: Assume the target account deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Push values to Secrets Manager and Parameter Store
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail

          secret_name="$ORG/$ENVIRONMENT/$INDEX/$SERVICE/secret"
          ssm_prefix="/$ORG/$ENVIRONMENT/$INDEX/$SERVICE"

          # ---- Secrets Manager: derive keys from the existing doc, overlay
          # same-named GitHub secrets. Missing/empty -> keep current value.
          cur=$(aws secretsmanager get-secret-value --secret-id "$secret_name" \
            --query SecretString --output text)
          payload=$(jq -n --argjson cur "$cur" --argjson gh "$SECRETS_JSON" '
            $cur | with_entries(
              .key as $k
              | .value = ( ($gh[$k]) as $v | if $v == null or $v == "" then .value else $v end )
            )')
          if [ "$(jq 'length' <<<"$payload")" -gt 0 ]; then
            aws secretsmanager put-secret-value --secret-id "$secret_name" \
              --secret-string "$payload" >/dev/null
            echo "Updated Secrets Manager secret: $secret_name"
          fi

          # ---- SSM Parameter Store: one param per existing key under the prefix.
          # Update-only (Terraform owns creation). Missing/empty GitHub var -> skip.
          aws ssm get-parameters-by-path --path "$ssm_prefix" --recursive \
            --query 'Parameters[].Name' --output text | tr '\t' '\n' | while read -r name; do
            [ -n "$name" ] || continue
            key="${name##*/}"
            val=$(jq -r --arg k "$key" '.[$k] // empty' <<<"$VARS_JSON")
            [ -n "$val" ] || { echo "skip $name (no GitHub variable $key)"; continue; }
            aws ssm put-parameter --name "$name" --type String --value "$val" --overwrite >/dev/null
            echo "Updated SSM parameter: $name"
          done

      - name: Read back and verify
        run: |
          set -euo pipefail

          secret_name="$ORG/$ENVIRONMENT/$INDEX/$SERVICE/secret"
          ssm_prefix="/$ORG/$ENVIRONMENT/$INDEX/$SERVICE"

          echo "== Secrets Manager: $secret_name (key = first 60 chars of value) =="
          aws secretsmanager get-secret-value --secret-id "$secret_name" \
            --query SecretString --output text \
            | jq -r 'to_entries[] | "  \(.key) = \(.value | tostring | .[0:60])"'

          echo "== SSM params under $ssm_prefix =="
          aws ssm get-parameters-by-path --path "$ssm_prefix" --recursive \
            --query 'Parameters[].[Name,Value]' --output text \
            | sed 's/^/  /'
